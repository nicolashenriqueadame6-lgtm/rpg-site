<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
</head>

<body>

    <h1>Login</h1>

    <form action="/login" method="POST">

        <label>Login:</label>
        <input type="text" name="login" required>

        <br><br>

        <label>Senha:</label>
        <input type="password" name="senha" required>

        <br><br>

        <button type="submit">Entrar</button>

    </form>

    <br>

    <a href="/">
        <button type="button">Voltar para o início</button>
    </a>

</body>
</html>
